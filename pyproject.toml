[project]

name = "ograph"
version = "1.0.0"
description = "Experimental Matplotlib API"
dependencies = ["matplotlib>=3.8.4"]
requires-python = ">= 3.12.0"

authors = [
    {name = "Lyodine", email = "lyodine@github.com"},
]

readme = "README.md"

license-files = ["LICENSE.md"]

keywords = []

# Overtagging
classifiers = [
    "Development Status :: 5 - Production/Stable",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",

    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[build-system]
requires = ["setuptools > 60.1.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
# packages = ["evokit"]
find = {}

[project.urls]
Documentation = "https://yidingli.com/docs/ograph/"
Repository = "https://yidingli.com/projects/ograph/"